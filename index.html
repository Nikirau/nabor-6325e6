:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#171A20; --muted:#5E6878; --line:#D6DAE0;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101318; --surface:#1A1F27; --ink:#EEF1F4; --muted:#9AA4B4; --line:#2C333F;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101318; --surface:#1A1F27; --ink:#EEF1F4; --muted:#9AA4B4; --line:#2C333F;
  --red:#F0596B; --yellow:#F0B92E; --blue:#58A6E0; --green:#56C16A;

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 17px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.sync{font-size:12px;color:var(--muted)}
.who{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button.who{cursor:pointer}
#peer{max-width:30vw}
#peer.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.ro [data-act]:not([data-nav]):not(.check){display:none}
.ro .check,.ro .field{pointer-events:none}
.ro .sets,.ro #wnew,.ro label[for=wnew]{display:none}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px}
.title{font:700 20px/1.2 var(--display);letter-spacing:-.01em;margin:4px 0 12px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.datebar span{font-weight:500}
.ic{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1}
.kcal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kcal b{font:700 44px/1 var(--display);letter-spacing:-.03em}
.kcal span{color:var(--muted)}
.plates{position:relative;display:flex;gap:3px;height:36px;margin:14px 0 8px;align-items:center}
.plates::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:4px;margin-top:-2px;background:var(--line);border-radius:2px}
.plates i{position:relative;flex:1;height:100%;border-radius:3px;background:var(--soft)}
.plates i.on{background:var(--ink)}
.plates.done i.on{background:var(--green)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro small{display:block;color:var(--muted);font-size:13px}
.macro b{font-weight:600;font-size:15px}
.bar{height:5px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

.meal h2{font:600 16px/1.2 var(--body)}
.meal .head{display:flex;align-items:center;gap:10px}
.meal .head span{color:var(--muted);font-size:14px;margin-left:auto}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list .nm{flex:1;min-width:0}
.list .nm small{display:block;color:var(--muted);font-size:13px}
.list .kc{font-weight:500;white-space:nowrap;font-size:14px}
.x{width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:20px;border-radius:8px}

.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--btn);color:var(--btn-ink);font-weight:600}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.stack{display:grid;gap:8px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:1 0 auto;min-width:42px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:500}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:14px;line-height:1;color:var(--btn-ink)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .nm{text-decoration:line-through;color:var(--muted)}
.check .amt{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.cat{font-weight:600;font-size:14px;color:var(--muted);margin:14px 0 2px}
.cat:first-child{margin-top:0}

.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex h3{font:600 16px/1.25 var(--body)}
.ex .tg{color:var(--muted);font-size:14px;white-space:nowrap}
.ex p{color:var(--muted);font-size:14px;margin-top:2px}
.ex .last{color:var(--ink)}
.ex .up{color:var(--green);font-weight:500}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.sets .field{text-align:center;font-weight:600}
label.f{display:block;font-size:14px;color:var(--muted)}
label.f .field{margin-top:4px;color:var(--ink);font-size:16px}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details summary{cursor:pointer;font-weight:600}
details ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
details li{margin-bottom:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.stats b{display:block;font:700 18px/1.2 var(--display)}
.stats small{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:12px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:block;text-align:center;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;padding:9px 2px 11px;border-top:3px solid transparent;margin-top:-1px}
.tab svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);border-top-color:var(--ink)}

.back{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;max-height:86%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet h2{font:700 17px/1.2 var(--display);flex:1}
.sheet .scroll{overflow-y:auto;margin:10px -4px 0;padding:0 4px;flex:1;min-height:120px}
.pick{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0}
.pick span{flex:1;min-width:0}
.pick small{color:var(--muted);white-space:nowrap}
.preview{font-weight:600;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:90vw;text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Math.round(n).toLocaleString('ru-RU');
const n1 = n => (Math.round(n*10)/10).toLocaleString('ru-RU');

const num = v => { const x = parseFloat(String(v).replace(',','.')); return isFinite(x) ? x : 0; };
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s => { const a = s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); };
const todayStr = () => dstr(new Date());
const wdIdx = s => (parseD(s).getDay()+6)%7;
const fmtDate = s => parseD(s).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
const fmtShort = s => parseD(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const shift = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };

function blank(){ return {
  main:{v:1, t:0, profile:{set:false,name:'',sex:'m',age:22,height:170,weight:50.5,act:1.45,goal:'gain',customKcal:0},
        customFoods:[], plan:{}, shopChecked:{}, weights:[], nextWorkout:'A', draft:{}},
  log:{v:1, t:0, diary:{}, workouts:[]} }; }
function normalize(s){
  const b = blank(); s = s || {};
  const m = Object.assign(b.main, s.main || {}); m.profile = Object.assign(blank().main.profile, (s.main||{}).profile || {});
  const l = Object.assign(b.log, s.log || {});
  ['customFoods','weights'].forEach(k => { if(!Array.isArray(m[k])) m[k] = []; });
  ['plan','shopChecked','draft'].forEach(k => { if(!m[k] || typeof m[k] !== 'object') m[k] = {}; });
  if(!Array.isArray(l.workouts)) l.workouts = [];
  if(!l.diary || typeof l.diary !== 'object') l.diary = {};
  return {main:m, log:l};
}
// mine: данные этого человека, единственное, что пишется в localStorage и в облако.
// state: то, что сейчас показано на экране: mine или данные второго человека (только просмотр).
let mine = blank(), state = mine;
const ui = {route:'today', day:todayStr(), planDay:wdIdx(todayStr()), sheet:null, ready:false, who:'me'};

/* ---------- хранение ---------- */
const LS = 'nabor-v1', LS_AUTH = 'nabor-auth-v1';
function readLocal(){ try{ const t = localStorage.getItem(LS); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify(mine)); return true; }catch(e){ return false; } }
function setSync(t){ const el = $('#sync'); if(el) el.textContent = t; }
function setMine(s){ mine = s; if(ui.who === 'me') state = s; }
function save(which){
  if(ui.who !== 'me') return;
  if(mine[which]) mine[which].t = Date.now();
  setSync(writeLocal() ? '' : 'не сохранено');
  if(cloud.auth){ cloud.dirty = true; later(1500); }
}
function init(){
  const local = readLocal();
  if(local) setMine(normalize(local));
  ui.ready = true;
  if(!mine.main.profile.set) location.hash = 'profile';
  route();
  syncNow();
}

/* ---------- облако: данные для двоих (Firebase REST, правила и настройка в CLAUDE.md) ---------- */
// apiKey и projectId не секрет: доступ защищают правила базы. Пока они пусты, облачная часть скрыта.
const FB = {
  apiKey:'', projectId:'',
  auth:'https://identitytoolkit.googleapis.com/v1/accounts:', token:'https://securetoken.googleapis.com/v1/token',
  db(){ return 'https://firestore.googleapis.com/v1/projects/' + this.projectId + '/databases/(default)/documents'; }
};
const cloudOn = () => !!(FB.apiKey && FB.projectId);
const cloud = {auth:readAuth(), peer:null, dirty:false, run:false, fails:0, fetched:0, timer:null, lastErr:null};
function readAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH)); }catch(e){ return null; } }
function writeAuth(a){ try{ if(a) localStorage.setItem(LS_AUTH, JSON.stringify(a)); else localStorage.removeItem(LS_AUTH); }catch(e){} }
async function http(url, opt){
  const r = await fetch(url, opt);
  let body = null; try{ body = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((body && body.error && (body.error.message || body.error.status)) || String(r.status)); err.status = r.status; throw err; }
  return body;
}
async function signIn(email, password){
  const r = await http(FB.auth + 'signInWithPassword?key=' + FB.apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password, returnSecureToken:true})});
  return {uid:r.localId, email:r.email, idToken:r.idToken, refreshToken:r.refreshToken, exp:Date.now() + (+r.expiresIn) * 1000};
}
async function idToken(){
  const a = cloud.auth;
  if(a.exp - Date.now() > 60000) return a.idToken;
  let r;
  try{ r = await http(FB.token + '?key=' + FB.apiKey, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.refreshToken)}); }
  catch(e){ if(e.status === 400 || e.status === 401) e.relogin = true; throw e; }
  Object.assign(a, {idToken:r.id_token, refreshToken:r.refresh_token, exp:Date.now() + (+r.expires_in) * 1000}); writeAuth(a);
  return a.idToken;
}
async function api(path, opt){
  opt = opt || {};
  const tk = await idToken();
  return http(FB.db() + path, Object.assign({}, opt, {headers:Object.assign({Authorization:'Bearer ' + tk}, opt.headers)}));
}
// Документ people/{uid}: name, email, t (время последней правки), main и log (JSON-строки).
const fstr = v => ({stringValue:String(v == null ? '' : v)});
const gstr = f => (f && f.stringValue) || '';
function gjson(f){ try{ const o = JSON.parse(gstr(f)); return o && typeof o === 'object' ? o : null; }catch(e){ return null; } }
function docBody(){
  return {fields:{name:fstr(mine.main.profile.name), email:fstr(cloud.auth.email), t:{integerValue:String(Math.max(mine.main.t || 0, mine.log.t || 0))},
    main:fstr(JSON.stringify(mine.main)), log:fstr(JSON.stringify(mine.log))}};
}
// Своё: побеждает более поздняя правка (t) отдельно для main и log.
async function pullMine(first){
  let d = null;
  try{ d = await api('/people/' + cloud.auth.uid); }catch(e){ if(e.status !== 404) throw e; }
  if(!d){
    if(mine.main.profile.set){ mine.main.t = mine.main.t || Date.now(); mine.log.t = mine.log.t || Date.now(); writeLocal(); cloud.dirty = true; }
    return false;
  }
  const rm = gjson(d.fields && d.fields.main), rl = gjson(d.fields && d.fields.log);
  const takeM = !!rm && (rm.t || 0) > (mine.main.t || 0), takeL = !!rl && (rl.t || 0) > (mine.log.t || 0);
  if(first && mine.main.profile.set && !mine.main.t && !mine.log.t && (takeM || takeL)
     && !confirm('В облаке уже есть твои данные. Заменить ими данные на этом устройстве?')){ const e = new Error('cancelled'); e.cancelled = true; throw e; }
  if(takeM || takeL){ setMine(normalize({main:takeM ? rm : mine.main, log:takeL ? rl : mine.log})); writeLocal(); }
  if((!takeM && (mine.main.t || 0) > ((rm && rm.t) || 0)) || (!takeL && (mine.log.t || 0) > ((rl && rl.t) || 0))) cloud.dirty = true;
  return takeM || takeL;
}
async function pullPeer(){
  const r = await api('/people?pageSize=20');
  const d = (r.documents || []).find(x => !x.name.endsWith('/' + cloud.auth.uid));
  const before = cloud.peer ? cloud.peer.t : null;
  if(!d){ cloud.peer = null; return before !== null; }
  const f = d.fields || {}, t = +((f.t || {}).integerValue || 0);
  cloud.peer = {name:gstr(f.name), email:gstr(f.email), t, state:normalize({main:gjson(f.main) || undefined, log:gjson(f.log) || undefined})};
  if(ui.who === 'partner') state = cloud.peer.state;
  return before !== t;
}
async function pushNow(){
  if(!cloud.dirty) return;
  cloud.dirty = false;
  try{ await api('/people/' + cloud.auth.uid, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(docBody())}); }
  catch(e){ cloud.dirty = true; throw e; }
}
async function withLock(fn){
  if(cloud.run) return false;
  cloud.run = true;
  try{ await fn(); cloud.fails = 0; cloud.lastErr = null; return true; }
  catch(e){ cloud.lastErr = e; cloudFail(e); return false; }
  finally{ cloud.run = false; }
}
function cloudFail(e){
  cloud.fails++;
  if(e.cancelled){ cloudSignOut(); toast('Вход отменён, данные на устройстве не тронуты'); return; }
  if(e.relogin){ cloud.auth = null; writeAuth(null); setSync('войди снова'); softRender(); return; }
  if(e.status === 403){ setSync('нет доступа к облаку'); return; }
  setSync('нет связи');
  if(cloud.fails < 5 && cloud.dirty) later(10000 * cloud.fails);
}
function later(ms){ clearTimeout(cloud.timer); cloud.timer = setTimeout(flush, ms); }
async function flush(){
  if(!cloudOn() || !cloud.auth) return;
  if(cloud.run){ later(1000); return; }
  setSync('сохраняю…');
  if(await withLock(pushNow)){ setSync(''); if(cloud.dirty) later(300); }
}
async function syncNow(first){
  if(!cloudOn() || !cloud.auth || cloud.run) return false;
  setSync('синхронизирую…');
  let changed = false;
  const ok = await withLock(async () => {
    changed = await pullMine(first);
    await pushNow();
    changed = (await pullPeer()) || changed;
  });
  if(ok){
    cloud.fetched = Date.now(); setSync('');
    if(ui.who === 'partner' && !cloud.peer) setWho('me'); else if(changed) softRender();
  }
  return ok;
}
function cloudSignOut(){
  cloud.auth = null; cloud.peer = null; cloud.dirty = false; clearTimeout(cloud.timer); writeAuth(null); setSync('');
  if(ui.who === 'partner') setWho('me');
}
function setWho(w){
  const peer = w === 'partner' && cloud.peer;
  ui.who = peer ? 'partner' : 'me'; state = peer ? cloud.peer.state : mine;
  ui.sheet = null; renderSheet(); render();
}
function softRender(){
  const a = document.activeElement;
  if(ui.ready && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) render();
}
function authMsg(e){
  const m = String(e.message);
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return 'Неверная почта или пароль';
  if(m.includes('INVALID_EMAIL')) return 'Проверь адрес почты';
  if(m.includes('TOO_MANY_ATTEMPTS')) return 'Слишком много попыток, подожди немного';
  return e.status ? 'Не удалось войти' : 'Нет связи с интернетом';
}
async function cloudLogin(){
  const email = $('#s-email').value.trim(), pw = $('#s-pass').value;
  if(!email || !pw){ toast('Укажи почту и пароль'); return; }
  setSync('вхожу…');
  try{ cloud.auth = await signIn(email, pw); }
  catch(e){ setSync(''); toast(authMsg(e)); return; }
  writeAuth(cloud.auth); cloud.fails = 0;
  const ok = await syncNow(true);
  if(ok) toast('Синхронизация включена');
  else if(cloud.auth) toast(cloud.lastErr && cloud.lastErr.status === 403 ? 'Нет доступа: этой почты нет в правилах базы' : 'Не удалось синхронизировать');
  render();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && !cloud.dirty && Date.now() - cloud.fetched > 30000) syncNow(); });
window.addEventListener('online', () => syncNow());
setInterval(() => { if(!document.hidden && !cloud.dirty && Date.now() - cloud.fetched > 90000) syncNow(); }, 30000);

/* ---------- расчёты ---------- */
function targets(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * p.act;
  const auto = Math.round((tdee + GOALS[p.goal][1]) / 50) * 50;
  const kcal = p.customKcal > 0 ? p.customKcal : auto;
  const pr = Math.round(1.8 * p.weight), fat = Math.round(1.1 * p.weight);
  const carb = Math.max(0, Math.round((kcal - 4*pr - 9*fat) / 4));
  return {tdee:Math.round(tdee), auto, kcal, p:pr, f:fat, c:carb};
}
function food(id){ return FOODS.find(x => x.id === id) || state.main.customFoods.find(x => x.id === id) || null; }
function nutr(e){ const f = food(e.f); if(!f) return {k:0,p:0,f:0,c:0}; const m = e.g/100; return {k:f.k*m,p:f.p*m,f:f.f*m,c:f.c*m}; }
function sum(list){ return (list||[]).reduce((a,e) => { const n = nutr(e); a.k+=n.k; a.p+=n.p; a.f+=n.f; a.c+=n.c; return a; }, {k:0,p:0,f:0,c:0}); }
function sumDay(day){ const t = {k:0,p:0,f:0,c:0}; MEALS.forEach(m => { const s = sum((day||{})[m[0]]); t.k+=s.k; t.p+=s.p; t.f+=s.f; t.c+=s.c; }); return t; }
function dayEmpty(day){ return !day || MEALS.every(m => !(day[m[0]]||[]).length); }
function amount(f, g){
  const w = g >= 1000 ? n1(g/1000) + ' кг' : nf(g) + ' г';
  return f.piece ? '≈ ' + Math.ceil(g/f.piece - 0.05) + ' шт (' + w + ')' : w;
}

function route(){
  const h = location.hash.replace('#','');
  ui.route = ['today','menu','shop','train','progress','profile'].includes(h) ? h : 'today';
  if(ui.route === 'profile' && ui.who !== 'me'){ ui.who = 'me'; state = mine; }
  render();
}
function render(){
  $('#tabs').innerHTML = TABS.map(t => `<a class="tab${ui.route===t[0]?' on':''}" href="#${t[0]}"${ui.route===t[0]?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${t[2]}</svg>${t[1]}</a>`).join('');
  $('#who').textContent = mine.main.profile.name || 'Профиль';
  const hasPeer = cloudOn() && !!cloud.auth && !!cloud.peer, pb = $('#peer');
  pb.hidden = !hasPeer; pb.classList.toggle('on', ui.who === 'partner');
  if(hasPeer) pb.textContent = ui.who === 'me' ? (cloud.peer.name || 'Второй') : 'Мои данные';
  $('#view').className = ui.who === 'partner' ? 'ro' : '';
  if(!ui.ready){ $('#view').innerHTML = '<p class="loading">Загружаю данные…</p>'; return; }
  const v = {today:viewToday, menu:viewMenu, shop:viewShop, train:viewTrain, progress:viewProgress, profile:viewProfile}[ui.route];
  const upd = ui.who === 'partner' && cloud.peer.t ? ' Обновлено ' + new Date(cloud.peer.t).toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) + '.' : '';
  $('#view').innerHTML = (ui.who === 'partner' ? `<p class="note" style="margin:0 0 12px">Ты смотришь данные: <b>${esc(cloud.peer.name || cloud.peer.email)}</b>. Только просмотр.${upd}</p>` : '') + v();
}
function hero(t, tg, label){
  const pct = tg.kcal ? t.k / tg.kcal : 0, on = Math.min(20, Math.round(pct*20));
  const left = tg.kcal - t.k;
  const bar = (v, max, col) => `<div class="bar"><i style="width:${Math.min(100, max ? v/max*100 : 0)}%;background:var(--${col})"></i></div>`;
  return `<div class="kcal"><b>${nf(t.k)}</b><span>из ${nf(tg.kcal)} ккал</span></div>
  <div class="plates${pct>=0.97?' done':''}" role="img" aria-label="${Math.round(pct*100)}% от нормы калорий">${Array.from({length:20},(_,i)=>`<i${i<on?' class="on"':''}></i>`).join('')}</div>
  <p class="sub">${left > 25 ? label + ' ' + nf(left) + ' ккал' : left < -25 ? 'Сверх нормы ' + nf(-left) + ' ккал' : 'Норма набрана'}</p>
  <div class="macros">
   <div class="macro"><small>Белки</small><b>${nf(t.p)} / ${tg.p} г</b>${bar(t.p,tg.p,'red')}</div>
   <div class="macro"><small>Жиры</small><b>${nf(t.f)} / ${tg.f} г</b>${bar(t.f,tg.f,'yellow')}</div>
   <div class="macro"><small>Углеводы</small><b>${nf(t.c)} / ${tg.c} г</b>${bar(t.c,tg.c,'blue')}</div>
  </div>`;
}
function meals(day, ctx){
  return MEALS.map(m => {
    const list = (day||{})[m[0]] || [], s = sum(list);
    return `<section class="card meal"><div class="head"><h2>${m[1]}</h2><span>${list.length ? nf(s.k)+' ккал' : ''}</span>
     <button class="btn small ghost" data-act="add" data-ctx="${ctx}" data-meal="${m[0]}">Добавить</button></div>
     ${list.length ? '<ul class="list">' + list.map((e,i) => { const f = food(e.f), n = nutr(e);
        return `<li><div class="nm">${esc(f ? f.name : 'Продукт удалён')}<small>${nf(e.g)} г, Б ${nf(n.p)} Ж ${nf(n.f)} У ${nf(n.c)}</small></div><span class="kc">${nf(n.k)} ккал</span>
        <button class="x" data-act="del" data-ctx="${ctx}" data-meal="${m[0]}" data-i="${i}" aria-label="Удалить ${esc(f ? f.name : 'продукт')}">×</button></li>`; }).join('') + '</ul>' : ''}
    </section>`; }).join('');
}

function shopping(){
  const tot = {};
  for(let i=0;i<7;i++){ const d = state.main.plan[i]; if(!d) continue; MEALS.forEach(m => (d[m[0]]||[]).forEach(e => { tot[e.f] = (tot[e.f]||0) + e.g; })); }
  return tot;
}
function viewShop(){
  const tot = shopping(), ids = Object.keys(tot).filter(id => food(id));
  if(!ids.length) return `<h1 class="title">Список покупок</h1><section class="card"><p class="empty">Список собирается из меню на неделю. Пока меню пустое.</p><a class="btn" href="#menu" style="display:inline-block;text-decoration:none;margin-top:8px">Составить меню</a></section>`;
  const done = ids.filter(id => state.main.shopChecked[id]).length;
  let html = `<h1 class="title">Список покупок</h1><p class="sub" style="margin-bottom:12px">На 7 дней по твоему меню. Куплено ${done} из ${ids.length}.</p><section class="card">`;

    const rows = ids.filter(id => food(id).cat === c).sort((a,b) => food(a).name.localeCompare(food(b).name,'ru'));

  });
  return html + `</section><button class="btn ghost wide" data-act="uncheck"${done?'':' disabled'}>Снять все отметки</button>`;
}
function lastSets(exId){
  for(let i = state.log.workouts.length-1; i >= 0; i--){ const s = state.log.workouts[i].sets[exId]; if(s && s.length) return s; }
  return null;
}

   <button class="btn wide" data-act="finish" style="margin-top:6px">Завершить тренировку</button>
  </section>

   <li>Три тренировки в неделю через день, А и Б чередуются.</li>
   <li>Перед началом 5 минут разминки: суставная гимнастика и по одному лёгкому подходу.</li>
   <li>Заканчивай подход, когда в запасе остаётся 1–2 чистых повтора.</li>
   <li>Когда во всех трёх подходах взят верх диапазона, усложняй: добавь вес в рюкзак, опускайся 3 секунды или возьми вариант сложнее.</li>
  </ul></details></section>
  ${hist.length ? `<section class="card"><h2 style="font:600 16px/1.2 var(--body);margin-bottom:6px">Последние тренировки</h2>${hist.map((h,i) => {
     const p = PROGRAM[h.w] || PROGRAM.A, idx = state.log.workouts.length - 1 - i;
     return `<details style="padding:8px 0;border-top:1px solid var(--line)"><summary style="font-weight:500">${fmtDate(h.d)}, ${p.name.toLowerCase()}</summary><ul>${p.ex.filter(x => h.sets[x.id]).map(x => `<li>${x.name}: ${h.sets[x.id].join(', ')}${x.unit?' '+x.unit:''}</li>`).join('')}</ul>
      <button class="btn small ghost" data-act="delw" data-i="${idx}" style="margin-top:8px">Удалить запись</button></details>`; }).join('')}</section>` : ''}`;
}
function chart(ws){
  const W=320,H=150,pl=36,pr=10,pt=12,pb=24;
  const xs = ws.map(x => parseD(x.d).getTime()), ys = ws.map(x => x.w);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if(y1-y0 < 1){ const m=(y0+y1)/2; y0=m-.5; y1=m+.5; }
  const x0 = xs[0], x1 = xs[xs.length-1];
  const X = t => pl + (x1===x0 ? .5 : (t-x0)/(x1-x0)) * (W-pl-pr), Y = v => pt + (1-(v-y0)/(y1-y0)) * (H-pt-pb);
  const pts = ws.map((p,i) => X(xs[i]).toFixed(1)+','+Y(p.w).toFixed(1));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">
   <line x1="${pl}" y1="${Y(y1)}" x2="${W-pr}" y2="${Y(y1)}" stroke="var(--line)"/><line x1="${pl}" y1="${Y(y0)}" x2="${W-pr}" y2="${Y(y0)}" stroke="var(--line)"/>
   <text x="${pl-6}" y="${Y(y1)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${n1(y1)}</text>
   <text x="${pl-6}" y="${Y(y0)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${n1(y0)}</text>
   <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtShort(ws[0].d)}</text>
   <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(ws[ws.length-1].d)}</text>
   <polyline points="${pts.join(' ')}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map(p => { const a = p.split(','); return `<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--surface)" stroke="var(--green)" stroke-width="2"/>`; }).join('')}
  </svg>`;
}
function weightHint(ws, goal){
  if(ws.length < 2) return 'Взвешивайся утром натощак 2–3 раза в неделю. Через две недели здесь появится подсказка по калориям.';
  const last = ws[ws.length-1], from = shift(last.d, -21), win = ws.filter(x => x.d >= from);
  const span = (parseD(last.d) - parseD(win[0].d)) / 864e5;
  if(span < 13) return 'Данных пока мало. Подсказка по калориям появится, когда наберётся две недели записей.';
  const rate = (last.w - win[0].w) / span * 7, r = (rate>=0?'+':'−') + n1(Math.abs(rate)) + ' кг в неделю';
  if(goal !== 'gain') return 'Темп за последние недели: ' + r + '.';
  if(rate < 0.2) return 'Темп ' + r + ': вес почти стоит. Добавь 150–200 ккал к норме в профиле.';
  if(rate > 0.6) return 'Темп ' + r + ': быстрее, чем нужно. Можно убрать 100–150 ккал.';
  return 'Темп ' + r + ': то, что нужно, ничего не меняй.';
}
function viewProgress(){
  const ws = state.main.weights, p = state.main.profile;
  const first = ws[0], last = ws[ws.length-1];
  return `<h1 class="title">Прогресс</h1>
  <section class="card">
   <label class="f" for="wnew">Вес сегодня, кг</label>
   <div class="row" style="margin-top:4px"><input class="field grow" id="wnew" type="text" inputmode="decimal" placeholder="${n1(p.weight)}"><button class="btn" data-act="addw">Записать вес</button></div>
   ${ws.length >= 2 ? chart(ws) : ''}
   ${ws.length ? `<div class="stats"><div><b>${n1(first.w)}</b><small>старт, кг</small></div><div><b>${n1(last.w)}</b><small>сейчас, кг</small></div><div><b>${(last.w-first.w>=0?'+':'−')+n1(Math.abs(last.w-first.w))}</b><small>изменение, кг</small></div></div>` : ''}
   <p class="note">${weightHint(ws, p.goal)}</p>
  </section>
  ${ws.length ? `<section class="card"><h2 style="font:600 16px/1.2 var(--body)">Записи</h2><ul class="list">${ws.slice(-10).reverse().map(x => `<li><div class="nm">${fmtDate(x.d)}</div><span class="kc">${n1(x.w)} кг</span><button class="x" data-act="delwt" data-d="${x.d}" aria-label="Удалить запись ${fmtDate(x.d)}">×</button></li>`).join('')}</ul></section>` : ''}
  <section class="card"><p class="sub">Тренировок записано: <b style="color:var(--ink)">${state.log.workouts.length}</b></p></section>`;
}
function cloudCard(){
  if(!cloudOn()) return '';
  const h = '<section class="card"><h2 style="font:600 16px/1.2 var(--body);margin-bottom:6px">Синхронизация</h2>';
  if(cloud.auth) return h + `<p class="sub" style="margin-bottom:12px">Вход выполнен: ${esc(cloud.auth.email)}.<br>${cloud.peer ? 'Второй человек: ' + esc(cloud.peer.name || cloud.peer.email) + '.' : 'Второй человек пока не появился.'}</p>
   <div class="stack"><button class="btn ghost" data-act="syncnow">Синхронизировать сейчас</button><button class="btn ghost" data-act="signout">Выйти</button></div></section>`;
  return h + `<p class="sub" style="margin-bottom:12px">Войди своей почтой на всех своих устройствах, и данные будут общими. Второй человек входит со своей почтой, и вы видите прогресс друг друга.</p>
   <div class="form"><label class="f">Почта<input class="field" id="s-email" type="email" autocomplete="username" inputmode="email"></label>
   <label class="f">Пароль<input class="field" id="s-pass" type="password" autocomplete="current-password"></label>
   <button class="btn" data-act="signin">Войти</button></div></section>`;
}
function viewProfile(){
  const p = state.main.profile, tg = targets(p);
  const opt = (v, cur, label) => `<option value="${v}"${String(v)===String(cur)?' selected':''}>${label}</option>`;
  return `<h1 class="title">${p.set ? 'Профиль' : 'Сначала о тебе'}</h1>
  ${p.set ? '' : '<p class="sub" style="margin-bottom:12px">По этим данным считается норма калорий и БЖУ. Всё можно поменять позже.</p>'}
  <section class="card"><div class="form">
   <label class="f">Имя<input class="field" id="p-name" type="text" autocomplete="given-name" value="${esc(p.name)}"></label>
   <div class="two">
    <label class="f">Пол<select class="field" id="p-sex">${opt('m',p.sex,'Мужской')}${opt('f',p.sex,'Женский')}</select></label>
    <label class="f">Возраст<input class="field" id="p-age" type="text" inputmode="numeric" value="${p.age}"></label>
   </div>
   <div class="two">
    <label class="f">Рост, см<input class="field" id="p-height" type="text" inputmode="decimal" value="${p.height}"></label>
    <label class="f">Вес, кг<input class="field" id="p-weight" type="text" inputmode="decimal" value="${p.weight}"></label>
   </div>
   <label class="f">Активность<select class="field" id="p-act">${ACTS.map(a => opt(a[0],p.act,a[1])).join('')}</select></label>
   <label class="f">Цель<select class="field" id="p-goal">${Object.keys(GOALS).map(g => opt(g,p.goal,GOALS[g][0])).join('')}</select></label>
   <label class="f">Своя норма, ккал (необязательно)<input class="field" id="p-custom" type="text" inputmode="numeric" placeholder="Авто: ${nf(tg.auto)}" value="${p.customKcal > 0 ? p.customKcal : ''}"></label>
   <button class="btn" data-act="saveprofile">Сохранить профиль</button>
  </div></section>
  ${p.set ? `<section class="card"><div class="stats" style="margin-top:0"><div><b>${nf(tg.tdee)}</b><small>поддержание, ккал</small></div><div><b>${nf(tg.kcal)}</b><small>норма, ккал</small></div><div><b>${tg.p}/${tg.f}/${tg.c}</b><small>Б/Ж/У, г</small></div></div></section>` : ''}
  ${cloudCard()}
  <section class="card"><h2 style="font:600 16px/1.2 var(--body);margin-bottom:6px">Копия данных</h2>
   <p class="sub" style="margin-bottom:12px">${cloud.auth ? 'Копия на случай, если что-то пойдёт не так: файл с твоими данными можно сохранить и загрузить обратно.' : 'Данные хранятся только в этом браузере. Чтобы перенести их на другое устройство, скачай копию и загрузи её там.'}</p>
   <div class="stack"><button class="btn ghost" data-act="export">Скачать копию данных</button><button class="btn ghost" data-act="import">Загрузить копию</button></div>
  </section>`;
}

/* ---------- окно добавления продукта ---------- */
function mealsOf(ctx, create){
  if(ctx === 'plan'){ if(!state.main.plan[ui.planDay] && create) state.main.plan[ui.planDay] = {}; return state.main.plan[ui.planDay]; }
  if(!state.log.diary[ui.day] && create) state.log.diary[ui.day] = {}; return state.log.diary[ui.day];
}
function foodList(q){
  q = q.trim().toLowerCase();
  const all = state.main.customFoods.concat(FOODS).filter(f => !q || f.name.toLowerCase().includes(q)).slice(0, 60);
  if(!all.length) return '<p class="empty">Ничего не нашлось. Добавь свой продукт.</p>';
  return all.map(f => `<button class="pick" data-act="pick" data-id="${esc(f.id)}"><span>${esc(f.name)}</span><small>${nf(f.k)} ккал / 100 г</small></button>`).join('');
}
function previewText(f, g){ const m = g/100; return g > 0 ? `${nf(f.k*m)} ккал, Б ${nf(f.p*m)} Ж ${nf(f.f*m)} У ${nf(f.c*m)}` : 'Укажи вес в граммах'; }
function renderSheet(){
  const s = ui.sheet, box = $('#sheet');
  if(!s){ box.innerHTML = ''; return; }
  const mealName = MEALS.find(m => m[0] === s.meal)[1];
  let body;
  if(s.mode === 'custom'){
    body = `<div class="form">
     <label class="f">Название<input class="field" id="c-name" type="text"></label>
     <div class="two"><label class="f">Ккал на 100 г<input class="field" id="c-k" type="text" inputmode="decimal"></label><label class="f">Белки, г<input class="field" id="c-p" type="text" inputmode="decimal"></label></div>
     <div class="two"><label class="f">Жиры, г<input class="field" id="c-f" type="text" inputmode="decimal"></label><label class="f">Углеводы, г<input class="field" id="c-c" type="text" inputmode="decimal"></label></div>
     <label class="f">Отдел магазина<select class="field" id="c-cat">${Object.keys(CATS).map(c => `<option value="${c}">${CATS[c]}</option>`).join('')}</select></label>
     <button class="btn" data-act="savecustom">Сохранить продукт</button>
     <button class="btn ghost" data-act="backpick">Назад к списку</button></div>`;
  } else if(s.sel){
    const f = food(s.sel);
    body = `<p style="font-weight:600">${esc(f.name)}</p><p class="sub">На 100 г: ${nf(f.k)} ккал, Б ${n1(f.p)} Ж ${n1(f.f)} У ${n1(f.c)}</p>
     <label class="f" style="margin-top:12px">Вес, г<input class="field" id="grams" type="text" inputmode="decimal" value="${s.g}"></label>
     ${f.piece ? `<div class="row" style="margin-top:8px">${[1,2,3].map(n => `<button class="btn small ghost" data-act="pieces" data-n="${n}">${n} шт</button>`).join('')}<span class="sub">1 шт ≈ ${f.piece} г</span></div>` : ''}
     <p class="preview" id="preview">${previewText(f, s.g)}</p>
     <div class="stack"><button class="btn" data-act="confirm">Добавить в «${mealName}»</button><button class="btn ghost" data-act="backpick">Назад к списку</button></div>`;
  } else {
    body = `<input class="field" id="q" type="search" placeholder="Найти продукт" aria-label="Найти продукт" value="${esc(s.q)}">
     <div class="scroll" id="foodlist">${foodList(s.q)}</div>
     <button class="btn ghost" data-act="custom" style="margin-top:10px">Добавить свой продукт</button>`;
  }
  box.innerHTML = `<div class="back" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Добавить продукт">
   <header><h2>${mealName}</h2><button class="x" data-act="close" aria-label="Закрыть">×</button></header>${body}</div>`;
}
let toastT;
function toast(t){ const el = $('#toast'); el.innerHTML = `<div class="toast">${esc(t)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, 2400); }

/* ---------- действия ---------- */
const ACT = {
  day(d){ ui.day = shift(ui.day, +d.n); render(); },
  pday(d){ ui.planDay = +d.i; render(); },
  add(d){ ui.sheet = {ctx:d.ctx, meal:d.meal, q:'', sel:null, g:100, mode:'pick'}; renderSheet(); },
  close(){ ui.sheet = null; renderSheet(); },
  pick(d){ const f = food(d.id); ui.sheet.sel = d.id; ui.sheet.g = f && f.piece ? f.piece : 100; renderSheet(); },
  backpick(){ ui.sheet.sel = null; ui.sheet.mode = 'pick'; renderSheet(); },
  custom(){ ui.sheet.mode = 'custom'; renderSheet(); },
  pieces(d){ const f = food(ui.sheet.sel); ui.sheet.g = f.piece * +d.n; $('#grams').value = ui.sheet.g; $('#preview').textContent = previewText(f, ui.sheet.g); },
  savecustom(){
    const name = $('#c-name').value.trim(), k = num($('#c-k').value);
    if(!name || k <= 0){ toast('Укажи название и калорийность'); return; }
    const f = {id:'c' + Date.now().toString(36), name:name.slice(0,80), cat:$('#c-cat').value, k, p:num($('#c-p').value), f:num($('#c-f').value), c:num($('#c-c').value), piece:0};
    state.main.customFoods.unshift(f); save('main');
    ui.sheet.mode = 'pick'; ui.sheet.sel = f.id; ui.sheet.g = 100; renderSheet();
  },
  confirm(){
    const s = ui.sheet, g = num($('#grams').value);
    if(g <= 0 || g > 5000){ toast('Укажи вес от 1 до 5000 г'); return; }
    const day = mealsOf(s.ctx, true); (day[s.meal] = day[s.meal] || []).push({f:s.sel, g});
    save(s.ctx === 'plan' ? 'main' : 'log');
    ui.sheet = null; renderSheet(); render(); toast('Добавлено');
  },
  del(d){ const day = mealsOf(d.ctx, false); if(!day || !day[d.meal]) return; day[d.meal].splice(+d.i, 1); save(d.ctx === 'plan' ? 'main' : 'log'); render(); },
  fill(){ const pl = state.main.plan[wdIdx(ui.day)]; if(dayEmpty(pl)) return; state.log.diary[ui.day] = clone(pl); save('log'); render(); toast('День заполнен из меню'); },
  copyweek(){ const src = state.main.plan[ui.planDay]; if(dayEmpty(src)) return; for(let i=0;i<7;i++) if(i !== ui.planDay) state.main.plan[i] = clone(src); save('main'); render(); toast('Скопировано на всю неделю'); },
  clearday(){ delete state.main.plan[ui.planDay]; save('main'); render(); },
  check(d){ if(state.main.shopChecked[d.id]) delete state.main.shopChecked[d.id]; else state.main.shopChecked[d.id] = true; save('main'); render(); },
  uncheck(){ state.main.shopChecked = {}; save('main'); render(); },
  wsel(d){ state.main.nextWorkout = d.w; save('main'); render(); },
  finish(){
    const w = state.main.nextWorkout === 'B' ? 'B' : 'A', draft = state.main.draft[w] || {}, sets = {};
    PROGRAM[w].ex.forEach(x => { const v = (draft[x.id] || []).map(num).filter(n => n > 0); if(v.length) sets[x.id] = v; });
    if(!Object.keys(sets).length){ toast('Запиши хотя бы один подход'); return; }
    state.log.workouts.push({d:todayStr(), w, sets});
    delete state.main.draft[w]; state.main.nextWorkout = w === 'A' ? 'B' : 'A';
    save('log'); save('main'); render(); window.scrollTo(0,0); toast('Тренировка сохранена');
  },
  delw(d){ state.log.workouts.splice(+d.i, 1); save('log'); render(); },
  addw(){
    const w = num($('#wnew').value);
    if(w < 25 || w > 300){ toast('Укажи вес в килограммах'); return; }
    const t = todayStr(), ws = state.main.weights.filter(x => x.d !== t); ws.push({d:t, w}); ws.sort((a,b) => a.d < b.d ? -1 : 1);
    state.main.weights = ws; state.main.profile.weight = w; save('main'); render(); toast('Вес записан');
  },
  delwt(d){ state.main.weights = state.main.weights.filter(x => x.d !== d.d); save('main'); render(); },
  saveprofile(){
    const p = state.main.profile, first = !p.set;
    const age = num($('#p-age').value), h = num($('#p-height').value), w = num($('#p-weight').value);
    if(age < 14 || age > 100 || h < 120 || h > 230 || w < 30 || w > 300){ toast('Проверь возраст, рост и вес'); return; }
    Object.assign(p, {name:$('#p-name').value.trim().slice(0,40), sex:$('#p-sex').value, age, height:h, weight:w, act:num($('#p-act').value), goal:$('#p-goal').value, customKcal:Math.max(0, Math.round(num($('#p-custom').value))), set:true});
    save('main');
    if(first){ location.hash = 'today'; } else render();
    toast('Профиль сохранён');
  },
  export(){
    const doc = {app:'nabor', v:1, saved:new Date().toISOString(), data:state};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], {type:'application/json'}));
    a.download = 'nabor-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Копия скачана');
  },
  import(){ $('#import-file').click(); },
  signin(){ cloudLogin(); },
  signout(){ cloudSignOut(); render(); toast('Вышел, данные на устройстве остались'); },
  syncnow(){ syncNow().then(ok => { toast(ok ? 'Синхронизировано' : 'Не удалось синхронизировать'); render(); }); },
  swap(){ setWho(ui.who === 'me' ? 'partner' : 'me'); window.scrollTo(0,0); }
};
function parseBackup(text){
  const doc = JSON.parse(text);
  const src = doc && doc.data && typeof doc.data === 'object' ? doc.data : doc;
  if(!src || typeof src !== 'object' || (!src.main && !src.log)) throw new Error('format');
  const s = normalize(clone(src));
  s.main.weights = s.main.weights.filter(x => x && typeof x.d === 'string' && isFinite(x.w));
  s.log.workouts = s.log.workouts.filter(x => x && typeof x.d === 'string' && x.sets && typeof x.sets === 'object');
  return s;
}
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  let s;
  try{ s = parseBackup(await file.text()); }catch(err){ toast('Не удалось прочитать файл копии'); return; }
  if(!confirm('Заменить все данные в этом браузере данными из файла? Текущие данные будут потеряны.')) return;
  setMine(s); save('main'); save('log'); ui.day = todayStr(); ui.planDay = wdIdx(ui.day); ui.sheet = null; renderSheet();
  if(!state.main.profile.set && location.hash !== '#profile') location.hash = 'profile'; else render();
  toast('Данные загружены');
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if(fn && ui.who === 'partner' && !['day','pday','swap'].includes(el.dataset.act)) return; // чужие данные только для просмотра
  if(fn){ e.preventDefault(); fn(el.dataset); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(ui.who !== 'me') return;
  if(t.id === 'q' && ui.sheet){ ui.sheet.q = t.value; $('#foodlist').innerHTML = foodList(t.value); }
  else if(t.id === 'grams' && ui.sheet){ ui.sheet.g = num(t.value); $('#preview').textContent = previewText(food(ui.sheet.sel), ui.sheet.g); }
  else if(t.dataset.set){
    const w = state.main.nextWorkout === 'B' ? 'B' : 'A';
    const d = state.main.draft[w] = state.main.draft[w] || {};
    (d[t.dataset.set] = d[t.dataset.set] || ['','',''])[+t.dataset.i] = t.value.slice(0,4);
    save('main');
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ui.sheet) ACT.close(); });
window.addEventListener('hashchange', route);
render();
init();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
